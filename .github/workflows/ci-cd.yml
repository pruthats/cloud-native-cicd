name: CI/CD Pipeline

# test ──► build (+ push to Docker Hub) ──► deploy to Kubernetes
#   └────► e2e on an ephemeral kind cluster (parallel with build)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Newer runs on the same PR/branch cancel older ones; never cancel a deploy on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  K8S_NAMESPACE: cloud-native-app

jobs:
  # ---------------------------------------------------------------- 1. TEST
  test:
    name: Lint & unit test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [course, registration]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check ${{ matrix.service }}

      - name: Unit tests (pytest)
        working-directory: ${{ matrix.service }}
        run: python -m pytest -v

  # ------------------------------------------------- 2. BUILD & PUSH IMAGES
  build:
    name: Build${{ github.event_name != 'pull_request' && ' & push' || '' }} image (${{ matrix.service }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [course, registration]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Pull requests only build (no secrets are exposed to forks, nothing is pushed).
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME || 'local' }}/${{ matrix.service }}-service
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ------------------------- 3. END-TO-END TEST ON AN EPHEMERAL K8S CLUSTER
  e2e:
    name: E2E on kind cluster
    needs: test
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: local
      IMAGE_TAG: ci
    steps:
      - uses: actions/checkout@v4

      - name: Build images locally
        run: |
          docker build -t docker.io/local/course-service:ci ./course
          docker build -t docker.io/local/registration-service:ci ./registration

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci

      - name: Load images into kind
        run: |
          kind load docker-image docker.io/local/course-service:ci --name ci
          kind load docker-image docker.io/local/registration-service:ci --name ci

      - name: Deploy manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          for f in k8s/course.yaml k8s/registration.yaml; do
            envsubst '${DOCKERHUB_USERNAME} ${IMAGE_TAG}' < "$f" | kubectl apply -f -
          done

      - name: Wait for rollout
        run: |
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/course --timeout=120s
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/registration --timeout=120s

      - name: Smoke test through the Service
        run: |
          kubectl -n "$K8S_NAMESPACE" port-forward svc/registration 5000:5000 &
          sleep 5
          BASE_URL=http://localhost:5000 ./scripts/smoke-test.sh

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl -n "$K8S_NAMESPACE" get all -o wide || true
          kubectl -n "$K8S_NAMESPACE" describe pods || true
          kubectl -n "$K8S_NAMESPACE" logs -l app=course --tail=100 || true
          kubectl -n "$K8S_NAMESPACE" logs -l app=registration --tail=100 || true

  # ------------------------------------------------ 4. DEPLOY TO KUBERNETES
  deploy:
    name: Deploy to Kubernetes
    needs: [build, e2e]
    # Runs only on pushes to main AND once the repository variable DEPLOY_ENABLED is "true"
    # (Settings > Secrets and variables > Actions > Variables). See docs/SETUP.md.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: self-hosted
    environment:
      name: production          # add required reviewers here for a manual approval gate
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "::error::Secret KUBE_CONFIG is not set - see docs/SETUP.md section 7"; exit 1
          fi
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Set image tag (immutable commit SHA)
        run: echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Debug Kubernetes configuration
        run: |
          echo "KUBECONFIG=${KUBECONFIG:-not-set}"
          kubectl config get-contexts
          kubectl config current-context

      - name: Deploy Kubernetes manifests
        env:
          K8S_NAMESPACE: cloud-native-app
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -e
          for f in k8s/course.yaml k8s/registration.yaml; do
            echo "Applying $f"
            envsubst '${DOCKERHUB_USERNAME} ${IMAGE_TAG}' < "$f" |
              kubectl apply -n "$K8S_NAMESPACE" -f -
          done

      - name: Wait for rollout
        run: |
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/course --timeout=180s
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/registration --timeout=180s

      - name: Smoke test deployed app
        run: |
          kubectl -n "$K8S_NAMESPACE" port-forward svc/registration 5000:5000 &
          sleep 5
          BASE_URL=http://localhost:5000 ./scripts/smoke-test.sh

      - name: Roll back on failure
        if: failure()
        run: |
          kubectl -n "$K8S_NAMESPACE" rollout undo deployment/course || true
          kubectl -n "$K8S_NAMESPACE" rollout undo deployment/registration || true
